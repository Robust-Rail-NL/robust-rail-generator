fail_fast: true

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: debug-statements
    -   id: trailing-whitespace
    -   id: end-of-file-fixer

-   repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.16.3
    hooks:
    -   id: ruff-format
    -   id: ruff-check
        args: [--fix]
