fail_fast: true

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: debug-statements
    -   id: trailing-whitespace
    -   id: end-of-file-fixer

# Direct commits to edge are refused (see CONTRIBUTING.md); it only advances
# via `git merge --no-ff`. A local hook rather than the stock
# `no-commit-to-branch`, which also refuses the commit that concludes a
# conflicted merge.
-   repo: local
    hooks:
    -   id: edge-commit-guard
        name: refuse direct commits to edge
        entry: .githooks/edge-commit-guard.sh
        language: script
        always_run: true
        pass_filenames: false

-   repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.16.3
    hooks:
    -   id: ruff-format
    -   id: ruff-check
        args: [--fix]
