name: Python

# release/2.0.0 is the shared integration branch for the 2.0.0 release;
# main and dev are the stable ones.
on:
  push:
    branches: [ "main", "dev", "release/2.0.0" ]
  pull_request:
    branches: [ "main", "dev", "release/2.0.0" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v5
    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - name: Install dependencies
      run: uv sync --frozen
    - name: Test
      run: uv run --frozen pytest -q

  lint:
    runs-on: ubuntu-latest
    name: Lint
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v5
    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - name: Install dependencies
      run: uv sync --frozen
    - name: Ruff format
      run: uv run --frozen ruff format --check .
    - name: Ruff check
      run: uv run --frozen ruff check .

  schema:
    runs-on: ubuntu-latest
    name: Schema freshness
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v5
    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - name: Install dependencies
      run: uv sync --frozen

    # schema/*.json is the interchange contract the solver and the evaluator
    # validate against, and it is generated from the Pydantic models rather
    # than written by hand. If a model changes and the export is not re-run,
    # everything downstream keeps validating against the old contract and
    # reports success — which is worse than not validating at all.
    - name: Check the exported schemas match the models
      run: |
        uv run --frozen python scripts/export_schema.py
        git diff --exit-code schema/ \
          || { echo "::error::schema/ is stale — run 'python scripts/export_schema.py' and commit the result"; exit 1; }

  examples:
    runs-on: ubuntu-latest
    name: Example output freshness
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v5
    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - name: Install dependencies
      run: uv sync --frozen

    # data/example_scenario.json and data/scenarios/*.json are generated
    # output checked in for browsing, not hand-maintained. Nothing else
    # regenerates them, so they can silently rot out of sync with the
    # generator (this happened for months before it was caught by hand).
    - name: Check the example output matches the generator
      run: |
        uv run --frozen python scripts/regenerate_examples.py
        git diff --exit-code data/ \
          || { echo "::error::data/ example output is stale — run 'python scripts/regenerate_examples.py' and commit the result"; exit 1; }
